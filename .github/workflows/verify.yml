name: Verify release
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  site:
    name: Site checks
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: synthetic-ci-only
          POSTGRES_DB: intake_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:synthetic-ci-only@127.0.0.1:5432/intake_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm run check
      - run: npx playwright install --with-deps chromium
      - run: npm run smoke
      - run: node scripts/smoke-hosted-intake.mjs
      - name: Local isolated intake browser test
        run: |
          node prototype/server.mjs &
          for i in 1 2 3 4 5; do curl -fsS http://127.0.0.1:8913/local-draft/ >/dev/null && break || sleep 1; done
          node scripts/smoke-prototype.mjs
      - name: Ensure production omits the draft
        run: |
          CONTEXT=production DRAFT_PROTOTYPE=1 npm run build
          test ! -e static-dist/draft-application
