name: Verify release
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  site:
    name: Site checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm run check
      - run: npx playwright install --with-deps chromium
      - run: npm run smoke
