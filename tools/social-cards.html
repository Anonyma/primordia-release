<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Primordia sharing artwork</title>
  <link href="https://fonts.googleapis.com/css2?family=Jost:wght@700&family=Karla:wght@500&display=block" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; background: white; }
    .card { position: relative; width: 1200px; height: 630px; overflow: hidden; color: black; background: white; }
    .art { position: absolute; width: 1350px; height: auto; left: -85px; top: -20px; }
    .wide .art, .x .art { width: 1200px; height: 630px; left: 0; top: 0; }
    .cutout { position: absolute; inset: 0; width: 1200px; height: 630px; }
    .square .cutout { display: none; }
    h1, h2 { position: absolute; margin: 0; }
    /* Preserve the wordmark; give small-format headline lettering more air. */
    h1 { left: 48px; top: 28px; font: 700 122px/1 Jost, sans-serif; letter-spacing: -.08em; white-space: nowrap; }
    h2 { right: 48px; top: 422px; font: 500 80px/1.08 Karla, sans-serif; letter-spacing: -.07em; text-align: right; }
    h2 span { display: block; white-space: nowrap; }
    .square { height: 1200px; }
    .square .art { width: 1280px; left: -40px; top: -180px; }
    .square h1 { left: 56px; top: 76px; font-size: 120px; }
    .square h2 { left: 308px; right: 56px; top: 604px; font-size: 138px; line-height: 1.06; letter-spacing: -.04em; text-align: left; }
    .x { height: 600px; }
    .x .art { top: -15px; }
    .x .cutout { top: -20px; }
    .x h1 { top: 20px; font-size: 116px; }
    .x h2 { top: 400px; font-size: 78px; }
  </style>
</head>
<body>
  <main class="card" aria-label="Primordia. Funding Early Biology Experiments">
    <img class="art" src="social-background.png" alt="">
    <svg class="cutout" viewBox="0 0 1200 630" aria-hidden="true">
      <path fill="white" d="M1200 395 H728 Q680 395 680 443 Q680 480 638 480 H496 Q448 480 448 528 V630 H1200 Z"/>
    </svg>
    <h1>PRIMORDIA</h1>
    <h2><span>Funding Early</span><span>Biology Experiments</span></h2>
  </main>
  <script>
    const format = new URLSearchParams(location.search).get('format') || 'wide';
    document.querySelector('.card').classList.add(format);
    if (format === 'square') {
      document.querySelector('.art').src = '../images/primordia_hero_shape_mobile.webp';
      document.querySelector('h2').innerHTML = '<span>Funding Early</span><span>Biology</span><span>Experiments</span>';
    }
  </script>
</body>
</html>
